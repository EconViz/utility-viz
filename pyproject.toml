[project]
name = "utility-viz"
version = "2.0.0b3"
description = "A Python toolkit for producing publication-quality microeconomics diagrams."
readme = "README.md"
authors = [{ name = "Pin Yue Sung", email = "contact@econ-viz.org" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<4.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy (>=1.24.0)",
    "scipy (>=1.13.0,<2.0.0)",
    "sympy (>=1.12.0,<2.0.0)",
    "tomli (>=2.0.0) ; python_version < '3.11'",
    "mosaickit>=0.8.0,<0.9.0",
    "bezierkit>=1.0.1,<2.0.0",
]

[project.optional-dependencies]
animation   = ["kinetickit[raster]>=1.0.0b2,<2.0.0"]
interactive = ["ipywidgets (>=8.0.0)", "IPython (>=8.0.0)"]
all         = ["kinetickit[raster]>=1.0.0b2,<2.0.0", "ipywidgets (>=8.0.0)", "IPython (>=8.0.0)"]

[project.scripts]
utility-viz = "utility_viz.cli:main"

[project.urls]
Homepage = "https://econ-viz.org"
Documentation = "https://econ-viz.org"
Repository = "https://github.com/EconViz/utility-viz"
"Bug Tracker" = "https://github.com/EconViz/utility-viz/issues"
Changelog = "https://github.com/EconViz/utility-viz/blob/main/CHANGELOG.md"


[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "utility_viz"
module-root = ""

[tool.uv.workspace]
# econ-viz (the deprecated 1.x name) is a separate distribution that ships the econ_viz package and the
# econ-viz command, so upgrading it never overwrites files owned by utility-viz.
members = ["packages/econ-viz"]

[tool.uv.sources]
econ-viz = { workspace = true }

[dependency-groups]
dev = [
    "econ-viz",
    "mypy>=1.13.0",
    "pytest (>=8.0.0,<9.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=utility_viz --cov-report=term-missing --cov-report=html:htmlcov"

[tool.coverage.run]
source = ["utility_viz"]
branch = true
omit = ["utility_viz/logging.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 92

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["notebook"]
# econ_viz lives in the packages/econ-viz workspace member; keep it first-party for import sorting.
src = [".", "packages/econ-viz"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C901", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
packages = ["utility_viz"]
ignore_missing_imports = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
disable_error_code = ["annotation-unchecked"]
